resources:
  jobs:
    daily_orchestration_job:
      name: daily_orchestration_job
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
      tasks:
        - task_key: run_lakeflow_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakeflow_pipeline.id}
